[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "advanced-pcap-analyzer"
version = "1.0.0"
description = "Advanced PCAP/PCAPNG analysis application for network engineers, NOC, SREs, and security analysts"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Network Engineering Team"}
]
keywords = [
    "pcap",
    "pcapng",
    "network-analysis",
    "packet-analysis",
    "tcp-analysis",
    "network-diagnostics",
    "wireshark",
    "tshark",
    "noc",
    "sre",
    "security"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Security",
    "Topic :: System :: Networking",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pandas>=2.0.0",
    "plotly>=5.15.0",
    "sqlite-utils>=3.35",
    "duckdb>=0.9.0",
    "pyshark>=0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
advanced-pcap-analyzer = "main:app"

[project.urls]
Homepage = "https://github.com/example/advanced-pcap-analyzer"
Documentation = "https://github.com/example/advanced-pcap-analyzer#readme"
Repository = "https://github.com/example/advanced-pcap-analyzer"

[tool.setuptools.packages.find]
where = ["."]
include = ["pcap_analyzer*"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=pcap_analyzer --cov-report=term-missing"
